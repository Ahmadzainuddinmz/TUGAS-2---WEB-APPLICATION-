<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mengenal Form Nusantech Academy (Perbaikan)</title>
    <style>
        .error { font-size: 12px; color: #c00; min-height: 1em; margin: 2px 0 8px; }
        input { display: block; }
    </style>
</head>
<body>
    <form action="" id="loginForm" novalidate>
        <h1>Login</h1>
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Enter your Username..." autocomplete="username">
        <div class="error" id="errUsername"></div>

        <label for="password">Password</label>
        <!-- type="password" agar karakter tersamarkan -->
        <input type="password" id="password" class="form-control" placeholder="Enter your Password..." autocomplete="current-password">
        <div class="error" id="errPassword"></div>

        <button type="submit">Submit</button>
    </form>

    <script>
        const loginForm = document.getElementById("loginForm");
        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const username = document.getElementById("username");
            const password = document.getElementById("password");

            // trim() membuang spasi di awal/akhir, sehingga input spasi saja dianggap kosong
            const uVal = username.value.trim();
            const pVal = password.value.trim();

            document.getElementById("errUsername").textContent = uVal === "" ? "Username wajib diisi." : "";
            document.getElementById("errPassword").textContent = pVal === "" ? "Password wajib diisi." : "";

            if (uVal === "" || pVal === "") {
                alert("Ensure you input a value in both fields!");
                (uVal === "" ? username : password).focus();
                return;
            }

            alert("This form has been successfully submitted!");
            // Password TIDAK dicetak ke console (hanya username, itu pun hanya untuk debugging)
            console.log(`Form submitted for username: ${uVal}`);
            username.value = "";
            password.value = "";
        });
    </script>
</body>
</html>
